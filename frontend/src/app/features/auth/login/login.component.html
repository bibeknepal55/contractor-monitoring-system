<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
  <div class="form-header">
    <h2>Welcome Back</h2>
    <p>Sign in to your account to continue</p>
  </div>

  <div *ngIf="loginError" class="error-message">
    <mat-icon>error_outline</mat-icon>
    <span>{{ loginError }}</span>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Email Address</mat-label>
    <input matInput type="email" formControlName="email" placeholder="Enter your email" autocomplete="email">
    <mat-icon matPrefix>email</mat-icon>
    <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      {{ getEmailErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password" autocomplete="current-password">
    <mat-icon matPrefix>lock</mat-icon>
    <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
      <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      {{ getPasswordErrorMessage() }}
    </mat-error>
  </mat-form-field>

  <div class="forgot-password">
    <a routerLink="/auth/forgot-password">Forgot password?</a>
  </div>

  <button mat-raised-button color="primary" type="submit" class="login-button" [disabled]="isLoading">
    <mat-icon *ngIf="!isLoading">login</mat-icon>
    <span *ngIf="!isLoading">Sign In</span>
    <span *ngIf="isLoading">Signing in...</span>
  </button>

  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <div class="register-link">
    <p>Don't have an account? <a routerLink="/auth/register">Create Account</a></p>
  </div>
</form>
